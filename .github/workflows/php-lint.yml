name: PHP lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mysqli, mbstring, intl
          tools: none
      - name: Syntax-check every PHP file
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
                     -not -path './.git/*' \
                     -not -path './ketcher/*' \
                     -not -path '*/.svn/*' \
                     -print0)
          exit $fail
