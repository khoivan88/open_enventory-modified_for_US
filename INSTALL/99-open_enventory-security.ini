; Open Enventory: PHP hardening for the October 2026 "PHP2Shell" vulnerabilities
; (CVE-2026-109618, CVE-2026-109619). See docs/SECURITY_PHP2SHELL.md.
;
; UPDATING PHP IS THE FIX. These settings only narrow the attack surface while
; you patch. Copy this file into the conf.d directory of every PHP that serves
; web requests, then restart Apache / PHP-FPM:
;   Debian/Ubuntu: /etc/php/<version>/apache2/conf.d/  and/or  /etc/php/<version>/fpm/conf.d/
;   RHEL/Rocky/Alma: /etc/php.d/
;   XAMPP (Windows/Mac): append the lines to xampp/php/php.ini
; Settings must be in php.ini / conf.d, which is read before PHP parses the
; request body; setting them at runtime (ini_set) is too late.

; Open Enventory does not use upload-progress tracking. It is on by default and
; runs for every multipart POST even when no script calls session_start().
session.upload_progress.enabled = 0

; PHP 8.5 only (older versions ignore it): the fatal-error backtrace path of
; CVE-2026-109619.
fatal_error_backtraces = 0

; Do not advertise the PHP version in the X-Powered-By header.
expose_php = Off

; Do NOT set memory_limit = -1 as a "fix": it only blocks one known path and
; lets a single request use all memory. OE's .htaccess uses 512M.
